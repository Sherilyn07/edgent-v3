# One origin, two things behind it.
#
#   /       the built frontend, as static files
#   /api/   the API container, which is not exposed to the host at all
#
# Because they share an origin the browser never makes a cross-origin request,
# so CORS is not something you have to configure. The tunnel points here.

server {
    listen 80 default_server;
    server_name _;

    # With S3 the browser uploads straight to the bucket, so file bytes never
    # pass through here. Headroom, not a requirement.
    client_max_body_size 64M;

    root /usr/share/nginx/html;
    index index.html;

    # --- the event stream ---------------------------------------------------
    # Must come before the general /api/ block, and must not be buffered.
    # nginx buffers proxied responses by default, which would hold the stream
    # until it completed and defeat the entire point of streaming.
    location ~ ^/api/sessions/[^/]+/events$ {
        proxy_pass http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";

        proxy_buffering off;                 # the important line
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;              # a stream is idle, not dead
    }

    # --- everything else on the API -----------------------------------------
    location /api/ {
        # The trailing slash on both sides strips the prefix, so /api/sessions
        # arrives at the API as /sessions.
        proxy_pass http://api:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # A single-page app: unknown paths are the app's router, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames change when the content does, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
